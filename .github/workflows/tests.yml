name: Python Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        django-version: ["5.1", "5.2"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install "django~=${{ matrix.django-version }}"

      - name: Run tests
        run: pytest tests/ -v

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches [tool.mypy] python_version in pyproject.toml.
          python-version: "3.12"

      - name: Install dependencies
        # `ci` is included so the playwright call site in update_diagrams is
        # checked against real stubs rather than skipped via the mypy override.
        run: pip install -e ".[dev,ci]"

      - name: Type check
        run: mypy schematic/
